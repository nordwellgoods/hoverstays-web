<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Book at Lily Nails &amp; Spa</title>
<style>
:root{--bg:#faf7f4;--card:#fff;--ink:#2b2522;--mute:#7a6f69;--line:#e9e1da;--acc:#b5527a;--accink:#fff;--ok:#2f7a4f;--bad:#a8322d}
@media (prefers-color-scheme:dark){:root{--bg:#1c1917;--card:#26211e;--ink:#f3eee9;--mute:#a89e97;--line:#3a332e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.w{max-width:560px;margin:0 auto;padding:24px 16px 48px}h1{font-size:26px;margin:0 0 4px}h2{font-size:17px;margin:26px 0 10px}
.sub{color:var(--mute);margin:0 0 8px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:8px 0}
.opt{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit}
.opt.sel,.slot.sel,.day.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}.day{flex:0 0 64px;text-align:center;padding:10px 0;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--card);font:inherit;color:inherit}
.day small{display:block;color:var(--mute);font-size:12px}.day.off{opacity:.35;pointer-events:none}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}.slot{padding:10px 0;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;font:inherit;color:inherit}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--ink)}
.btn{display:block;width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:var(--acc);color:var(--accink);font:600 16px/1 inherit;cursor:pointer}
.btn.sec{background:transparent;color:var(--bad);border:1px solid var(--line)}.btn:disabled{opacity:.5}
.err{color:var(--bad);margin-top:10px}.muted{color:var(--mute)}.hide{display:none}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mute);font-weight:500}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tab{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer;font:inherit;color:inherit}.tab.sel{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
</style></head><body><script>
(()=>{const H={"days": [1, 2, 3, 4, 5, 6], "open": "10:00", "close": "19:00", "by_day": {"6": ["10:00", "17:00"]}},SV=[{"name": "Manicure", "minutes": 30}, {"name": "Gel manicure", "minutes": 45}, {"name": "Pedicure", "minutes": 45}, {"name": "Spa pedicure", "minutes": 60}, {"name": "Full set (acrylic)", "minutes": 75}, {"name": "Eyebrow wax", "minutes": 15}],STEP=30;
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const hor=d=>{const w=d.getDay()||7,b=(H.by_day||{})[String(w)];return b||(H.days.includes(w)?[H.open,H.close]:null)};
const m=t=>{const[a,b]=t.split(':');return +a*60+ +b};
const lab=x=>{let h=Math.floor(x/60),mi=x%60,ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+String(mi).padStart(2,'0')+' '+ap};
const ok=b=>new Response(JSON.stringify(b),{status:200,headers:{'Content-Type':'application/json'}});
window.fetch=async(u,o)=>{
 if(u.endsWith('/days')){const r=[];for(let k=1;k<31;k++){const d=new Date();d.setDate(d.getDate()+k);if(hor(d))r.push(iso(d))}return ok({days:r})}
 if(u.includes('/slots')){const q=new URL(u,location.href).searchParams,[y,mo,da]=q.get('date').split('-');
  const d=new Date(+y,+mo-1,+da),h=hor(d),dur=SV[+q.get('service')].minutes,s=[];
  if(h)for(let x=m(h[0]);x+dur<=m(h[1]);x+=STEP)if((x*7+ +da)%5)s.push({start:q.get('date')+'T'+x,label:lab(x)});
  return ok({slots:s})}
 if(u.endsWith('/book')){const b=JSON.parse(o.body),[f,x]=b.start.split('T'),[y,mo,da]=f.split('-');
  const d=new Date(+y,+mo-1,+da);return ok({service:SV[b.service].name,
  when:d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})+' at '+lab(+x)})}
};})();
</script><div style="background:#fff8e1;color:#5c4400;font:14px/1.4 -apple-system,Segoe UI,sans-serif;padding:10px 16px;text-align:center;border-bottom:1px solid #f0dca0">Draft for Lily Nails &amp; Spa. This is a preview: times are examples and nothing gets booked.</div><div class="w" style="">
<div class="tabs" style="justify-content:flex-end;margin-bottom:10px" role="group" aria-label="Language">
<button class="tab" id="l-en" type="button">English</button><button class="tab" id="l-es" type="button">Español</button></div>
<h1>Lily Nails &amp; Spa</h1><p class="sub">Rome, GA</p>
<div id="paso1"><h2 data-t="s1"></h2><div id="servs"></div></div>
<div id="paso2" class="hide"><h2 data-t="s2"></h2><div class="days" id="days"></div>
<div id="slots" class="slots" style="margin-top:12px"></div><p id="nos" class="muted hide" data-t="nos"></p></div>
<div id="paso3" class="hide"><h2 data-t="s3"></h2>
<label for="n" data-t="name"></label><input id="n" autocomplete="name">
<label for="p" data-t="phone"></label><input id="p" type="tel" autocomplete="tel" placeholder="(555) 123-4567">
<label for="m" data-t="email"></label><input id="m" type="email" autocomplete="email">
<p class="muted" style="font-size:13px" data-t="note"></p>
<button class="btn" id="ok" data-t="book"></button><p class="err" id="err"></p></div>
<div id="hecho" class="hide"><h2 data-t="done"></h2><div class="card" id="res"></div>
<p class="muted" data-t="done2"></p></div>
<script>
const SID="ejemplo",SERV=[{"name": "Manicure", "name_es": "", "minutes": 30, "price": 25}, {"name": "Gel manicure", "name_es": "", "minutes": 45, "price": 38}, {"name": "Pedicure", "name_es": "", "minutes": 45, "price": 35}, {"name": "Spa pedicure", "name_es": "", "minutes": 60, "price": 50}, {"name": "Full set (acrylic)", "name_es": "", "minutes": 75, "price": 55}, {"name": "Eyebrow wax", "name_es": "", "minutes": 15, "price": 12}],DAYS=30;
const T={en:{s1:"1. Choose a service",s2:"2. Pick a day and time",s3:"3. Your details",nos:"No times left that day. Try another day.",
name:"Name",phone:"Mobile phone",email:"Email",note:"We'll text you a confirmation and a reminder, and send the appointment to your calendar.",
book:"Book",done:"You're booked!",done2:"You'll get a text confirmation and a calendar invite by email.",load:"Loading…",
fail:"Something went wrong. Please try again.",loc:"en-US"},
es:{s1:"1. Elige un servicio",s2:"2. Elige el día y la hora",s3:"3. Tus datos",nos:"No quedan horarios ese día. Prueba con otro día.",
name:"Nombre",phone:"Celular",email:"Correo electrónico",note:"Te enviaremos un mensaje de confirmación y un recordatorio, y la cita llegará a tu calendario.",
book:"Reservar",done:"¡Listo, tu cita está reservada!",done2:"Te llegará un mensaje de confirmación y una invitación de calendario por correo.",load:"Cargando…",
fail:"Algo salió mal. Inténtalo de nuevo.",loc:"es-US"}};
let L=(navigator.language||'').toLowerCase().startsWith('es')?'es':'en';try{const g=localStorage.getItem('mk2lang');if(g in T)L=g;}catch(e){}
let sv=null,day=null,slot=null,last=null;const $=i=>document.getElementById(i);
function idioma(l){L=l;try{localStorage.setItem('mk2lang',l);}catch(e){}document.documentElement.lang=l;
document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T[L][e.dataset.t]);
$('l-en').classList.toggle('sel',L==='en');$('l-es').classList.toggle('sel',L==='es');servicios();
if(sv!==null)dias();if(day!==null)horas();if(last)$('res').innerHTML=last();}
$('l-en').onclick=()=>idioma('en');$('l-es').onclick=()=>idioma('es');
const nom=x=>L==='es'&&x.name_es?x.name_es:x.name;
function servicios(){$('servs').innerHTML='';SERV.forEach((x,i)=>{const b=document.createElement('button');b.className='card opt'+(sv===i?' sel':'');
b.innerHTML=`<span>${nom(x)}<br><small class="muted">${x.minutes} min</small></span><span>${x.price?'$'+x.price:''}</span>`;
b.onclick=()=>{document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));b.classList.add('sel');sv=i;slot=null;day=null;$('slots').innerHTML='';$('paso2').classList.remove('hide');$('paso3').classList.add('hide');dias();};$('servs').appendChild(b);});}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
async function dias(){const r=await fetch(`/api/${SID}/days`);const ok=(await r.json()).days;$('days').innerHTML='';
for(let k=0;k<DAYS;k++){const d=new Date();d.setDate(d.getDate()+k);const s=iso(d);const b=document.createElement('button');
b.className='day'+(ok.includes(s)?'':' off')+(s===day?' sel':'');b.innerHTML=`<small>${d.toLocaleDateString(T[L].loc,{weekday:'short'})}</small>${d.getDate()}<small>${d.toLocaleDateString(T[L].loc,{month:'short'})}</small>`;
b.onclick=()=>{document.querySelectorAll('.day').forEach(o=>o.classList.remove('sel'));b.classList.add('sel');day=s;horas();};$('days').appendChild(b);}}
async function horas(){$('slots').innerHTML=`<span class="muted">${T[L].load}</span>`;$('nos').classList.add('hide');
const r=await fetch(`/api/${SID}/slots?date=${day}&service=${sv}`);const d=await r.json();$('slots').innerHTML='';
if(!d.slots.length)$('nos').classList.remove('hide');
d.slots.forEach(t=>{const b=document.createElement('button');b.className='slot'+(t.start===slot?' sel':'');b.textContent=t.label;
b.onclick=()=>{document.querySelectorAll('.slot').forEach(o=>o.classList.remove('sel'));b.classList.add('sel');slot=t.start;$('paso3').classList.remove('hide');$('n').focus();};$('slots').appendChild(b);});}
$('ok').onclick=async()=>{$('err').textContent='';$('ok').disabled=true;
try{const r=await fetch(`/api/${SID}/book`,{method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({service:sv,start:slot,name:$('n').value,phone:$('p').value,email:$('m').value,lang:L})});const d=await r.json();
if(!r.ok){$('err').textContent=d.error||T[L].fail;if(d.refresh)horas();return;}
const x=SERV[sv];last=()=>`<b>${nom(x)}</b><br>${d.when}`;
['paso1','paso2','paso3'].forEach(i=>$(i).classList.add('hide'));$('res').innerHTML=last();$('hecho').classList.remove('hide');window.scrollTo(0,0);}
finally{$('ok').disabled=false;}};
idioma(L);
</script></div></body></html>
